# EX 313 LTD - EXagent portal
# mysystemservices.exrmm.com -> 127.0.0.1:8090 (node, loopback only)

map $http_upgrade $exrmm_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream exrmm_portal {
    server 127.0.0.1:8090;
    keepalive 32;
}

# Catch-all: do not answer requests addressed to a bare IP / unknown Host.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    if ($host = mysystemservices.exrmm.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name mysystemservices.exrmm.com;

    # ACME HTTP-01 challenges stay on plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }


}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mysystemservices.exrmm.com;

    # Replaced by the Let's Encrypt certificate once DNS points here.
    ssl_certificate /etc/letsencrypt/live/mysystemservices.exrmm.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mysystemservices.exrmm.com/privkey.pem; # managed by Certbot

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:exrmm_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/exrmm-access.log;
    error_log  /var/log/nginx/exrmm-error.log warn;

    client_max_body_size 64m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Agent download entry point. MeshCentral's own /meshagents needs a session
    # cookie, so the portal answers this path instead: it builds the same agent
    # (mesh id baked in, bound to the mesh it was asked for) as a one-click
    # silent installer. The exact location keeps priority over the SPA route.
    location = /meshagents {
        proxy_pass http://exrmm_portal/api/silent-agent$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }



    location / {
        proxy_pass http://exrmm_portal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $exrmm_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

}
