# MeshCentral public entry. Presents MeshCentral's own certificate so that the
# agent-pinned certificate hash stays identical to what the agents trust.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name mysystemservices.exrmm.com;

    ssl_certificate     /etc/letsencrypt/live/mysystemservices.exrmm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mysystemservices.exrmm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MCSSL:10m;
    client_max_body_size 256m;

    location / {
        proxy_pass https://127.0.0.1:8446;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
